name: Build & Push Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra tag to apply (in addition to sha + branch)'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: make deps

      - name: Generate code (webpack + bindata)
        run: make generate

      - name: Build fleet binary (linux amd64)
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -tags full \
            -ldflags "-s -w \
              -X github.com/fleetdm/fleet/v4/server/version.appName=fleet \
              -X github.com/fleetdm/fleet/v4/server/version.version=${{ github.ref_name }} \
              -X github.com/fleetdm/fleet/v4/server/version.branch=${{ github.ref_name }} \
              -X github.com/fleetdm/fleet/v4/server/version.revision=${{ github.sha }} \
              -X github.com/fleetdm/fleet/v4/server/version.buildDate=$(date -u +%Y-%m-%d) \
              -X github.com/fleetdm/fleet/v4/server/version.buildUser=github-actions \
              -X github.com/fleetdm/fleet/v4/server/version.goVersion=$(go version | awk '{print $3}')" \
            -o tools/fleet-docker/fleet ./cmd/fleet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: tools/fleet-docker
          file: tools/fleet-docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
